name: Build APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
              python3-pip \
              build-essential \
              git \
              python3-dev \
              ffmpeg \
              libsdl2-dev \
              libsdl2-image-dev \
              libsdl2-mixer-dev \
              libsdl2-ttf-dev \
              libfontconfig1-dev \
              libgl1-mesa-dev \
              libgles2-mesa-dev \
              zlib1g-dev \
              openjdk-17-jdk \
              autoconf \
              libtool \
              pkg-config

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install --user Cython==0.29.36 buildozer

      - name: Initialize Buildozer Spec
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
          fi
          sed -i 's/#requirements = python3,kivy/requirements = python3,pygame,sdl2_image,sdl2_mixer,sdl2_ttf,sdl2/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,pygame,sdl2_image,sdl2_mixer,sdl2_ttf,sdl2/g' buildozer.spec
          sed -i 's/#orientation = portrait/orientation = landscape/g' buildozer.spec
          sed -i 's/#android.api = 31/android.api = 33/g' buildozer.spec
          sed -i 's/android.sdk = 20/android.sdk = 33/g' buildozer.spec

      - name: Build APK with Buildozer
        run: |
          # استخدام yes مع بيبروني واختيار الموافقة عشان نتجاوز قصة التراخيص بدون إيقاف البناء
          yes y | buildozer -v android debug || true
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package-apk
          path: bin/*.apk
